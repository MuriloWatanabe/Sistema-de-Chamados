spring:
  application:
    name: helpdesk
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        globally_quoted_identifiers: true
        jdbc:
          time_zone: America/Sao_Paulo

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  security:
    jwt:
      secret: ${APP_SECURITY_JWT_SECRET:helpdesk-dev-secret-change-me}
      expiration-minutes: ${APP_SECURITY_JWT_EXPIRATION_MINUTES:120}

server:
  port: ${SERVER_PORT:8080}
